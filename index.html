<head>

        /* Canvas styling */
        canvas {
            border: 2px solid black;

        }

<body>

<div id="header" class="w3-container w3-flat-carrot">
    <h1>App6---HTML5-Canvas</h1>
</div>
	
<div id="content" class="w3-container">

    <p>Content goes here.</p>

    <!-- ===============================
         CANVAS
    =============================== -->
    <canvas id="myCanvas" width="300" height="300"></canvas>

    <br>

    <!-- ===============================
         BUTTONS (REQUIRED 4)
    =============================== -->
    <button onclick="drawRectangle()">Draw Rectangle</button>
    <button onclick="drawName()">Draw Name</button>
    <button onclick="drawImage()">Load Image</button>
    <button onclick="clearCanvas()">Clear Canvas</button>

    <p>The following code has been developed by students and/or researchers of the Freshman Research Initiative DIY Diagnostics Stream...</p>

    <p>THIS CODE SHOULD NOT BE USED TO DIAGNOSE ANY KIND OF MEDICAL CONDITION.</p>

</div>

<footer class="w3-bottom w3-container w3-flat-carrot">
    <p>DIY!</p>
</footer>

<!-- ===============================
     CANVAS JAVASCRIPT (FIXED ORDER)
=============================== -->
<script>

    // Get canvas AFTER page loads
    var canvas = document.getElementById("myCanvas");
    var ctx = canvas.getContext("2d");

    // Draw rectangle
    function drawRectangle() {
        ctx.fillStyle = "blue";
        ctx.fillRect(50, 50, 150, 100);
    }

    // Draw name
    function drawName() {
        ctx.font = "20px Arial";
        ctx.fillStyle = "green";
        ctx.fillText("Mariam", 80, 200);
    }

    // Draw image
    function drawImage() {
        var img = new Image();
        img.src = "https://unsplash.com/s/photos/cat";

        img.onload = function() {
            ctx.drawImage(img, 75, 75, 150, 150);
        };
    }

    // Clear canvas
    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

</script>

</body>
