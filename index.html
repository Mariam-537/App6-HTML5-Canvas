<body>

<div id="header" class="w3-container w3-flat-carrot">

<div id="content" class="w3-container">

    <p>Content goes here.</p>

    <!-- ===============================
         CANVAS
    =============================== -->
    <canvas id="myCanvas" width="300" height="300"></canvas>

    <br>

    <!-- ===============================
         This is like the cold and allergy button what to do when each of them are clicked, the functions of the buttons themselves will be coded below
    =============================== -->
    <button onclick="drawRectangle()">Draw Rectangle</button>
    <button onclick="drawName()">Draw Name</button>
    <button onclick="drawImage()">Load Image</button>
    <button onclick="clearCanvas()">Clear Canvas</button>

    <p>The following code has been developed by students and/or researchers of the Freshman Research Initiative DIY Diagnostics Stream</p>

    <p>THIS CODE SHOULD NOT BE USED TO DIAGNOSE ANY KIND OF MEDICAL CONDITION.</p>

</div>

<!-- 
     Canvas and its functions -->
<script>

    // Get canvas AFTER page loads, this will show the box that acts as the canvas for the app 
    var canvas = document.getElementById("myCanvas");
    var ctx = canvas.getContext("2d");

    // Draw rectangle
    function drawRectangle() {
        ctx.fillStyle = "blue"; //this function indicates the color of the rectangle 
        ctx.fillRect(50, 50, 150, 100); //this function indicates the dimensions of the rectangle
    }

    // Draw name, when clicked, this button will generate my name for the user
    function drawName() {
        ctx.font = "20px Arial"; //this function tells the code the font and the text size
        ctx.fillStyle = "pink"; //this function tells the code the color that my name will appear in 
        ctx.fillText("Mariam", 80, 200); //this function showcases my name 
    }

    // Draw image, this function should pop up an image of a cat on the canvas
    function drawImage() {
        var img = new Image();
        img.src = "https://images.unsplash.com/photo-1518791841217-8f162f1e1131";

        img.onload = function() {
            ctx.drawImage(img, 75, 75, 150, 150);
        };
    }

    // Clear canvas, when the button is clicked, this function will clear the canvas 
    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

</script>
